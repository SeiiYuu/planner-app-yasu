<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Workspace & Grading Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-pink-500 selection:text-white">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-pink-500/20 p-4 sticky top-0 z-50 shadow-lg shadow-pink-950/20">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <!-- Capybara App Icon -->
        <div class="bg-gradient-to-br from-pink-500 to-rose-600 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-pink-500/30">
          🦫
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white flex items-center gap-2">
            Teacher Planner <span class="text-xs bg-pink-500/10 text-pink-400 border border-pink-500/30 px-2 py-0.5 rounded-full font-normal">For Her 💖</span>
          </h1>
          <p class="text-xs text-pink-400/90 flex items-center gap-1.5 mt-0.5">
            <span id="sync-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
            <span id="sync-status-text">Connecting to Cloud Sync...</span>
          </p>
        </div>
      </div>
      <button onclick="addNewSection()" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Add Class / Section
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">

    <!-- Class Schedule Timeline -->
    <section class="bg-slate-900/70 backdrop-blur-sm rounded-2xl p-5 border border-pink-500/20 shadow-xl">
      <h2 class="text-xs font-bold uppercase tracking-wider text-pink-400 mb-3 flex items-center gap-2">
        <i class="fa-regular fa-clock text-pink-500"></i> Class Schedule & Room Agenda
      </h2>
      <div id="schedule-bar" class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <!-- Dynamic Schedule Cards -->
      </div>
    </section>

    <!-- Sections / Grading Workspace -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-200">Classes & Checking Workspace</h2>
        <span id="global-counter" class="text-xs bg-pink-950/60 border border-pink-800/60 text-pink-300 px-3 py-1 rounded-full font-mono shadow-sm">
          0 Papers Checked Overall
        </span>
      </div>

      <div id="sections-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Dynamic Section Cards -->
      </div>
    </section>

    <!-- Kei's Notes / Love Note Box at the Bottom -->
    <section class="bg-gradient-to-br from-slate-900/90 to-pink-950/20 backdrop-blur-sm rounded-2xl p-5 border border-pink-500/30 shadow-xl space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold uppercase tracking-wider text-pink-400 flex items-center gap-2">
          <i class="fa-solid fa-heart text-pink-500 animate-pulse"></i> Kei's Notes & Encouragement
        </h2>
        <span class="text-[10px] text-pink-400/60 font-mono">Syncs live to her screen ✨</span>
      </div>
      <textarea id="kei-notes-textarea" oninput="onNotesInput(this.value)" rows="3" class="w-full bg-slate-950/80 border border-slate-800 focus:border-pink-500/80 rounded-xl p-3.5 text-sm text-pink-100 placeholder-slate-600 focus:outline-none transition resize-none shadow-inner" placeholder="Type a sweet note here (e.g. i love you keep working hard <3)..."></textarea>
    </section>

  </main>

  <!-- Firebase & Application Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCD9EvQsWwB7cqMHAneg7iNJj1DgvyiBNw",
      authDomain: "planner-app-yasu.firebaseapp.com",
      projectId: "planner-app-yasu",
      storageBucket: "planner-app-yasu.firebasestorage.app",
      messagingSenderId: "87081581872",
      appId: "1:87081581872:web:369e247cc063ab4b27dcf5",
      measurementId: "G-7SH7JJ8XL3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "teacher_planner", "shared_state");

    let appData = {
      keiNotes: "i love you keep working hard <3",
      sections: [
        {
          id: "sec-1",
          sectionName: "Grade 10 - St. Jude",
          room: "Room 304",
          subject: "Mathematics",
          schedule: "08:00 AM - 09:30 AM",
          links: [
            { title: "Class Drive Folder", url: "https://drive.google.com" },
            { title: "LMS Portal", url: "https://canvas.instructure.com" }
          ],
          activities: [
            { id: "a1", title: "Quarter 1 Quiz Papers", checkedCount: 18, totalStudents: 30 },
            { id: "a2", title: "Performance Task #1", checkedCount: 30, totalStudents: 30 }
          ],
          generalTasks: [
            { id: "gt1", text: "Upload Activity 2 Rubrics to LMS", done: true },
            { id: "gt2", text: "Print Quiz Sets for Tomorrow", done: false }
          ]
        }
      ]
    };

    window.saveState = async function() {
      updateSyncStatus('saving');
      try {
        await setDoc(docRef, appData);
        updateSyncStatus('synced');
      } catch (err) {
        console.error("Cloud Save Failed:", err);
        updateSyncStatus('error');
      }
    };

    // Debounce timer for smooth typing in notes
    let saveTimeout = null;
    window.onNotesInput = function(val) {
      appData.keiNotes = val;
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        window.saveState();
      }, 500); // saves 500ms after you stop typing
    };

    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const cloudData = docSnap.data();
        appData = cloudData;
        if (!appData.sections) appData.sections = [];
        
        // Sync textarea without interrupting user focus if currently typing
        const notesBox = document.getElementById('kei-notes-textarea');
        if (notesBox && document.activeElement !== notesBox) {
          notesBox.value = appData.keiNotes || "";
        } else if (notesBox && !notesBox.value && appData.keiNotes) {
          notesBox.value = appData.keiNotes;
        }

        renderUI();
        updateSyncStatus('synced');
      } else {
        window.saveState();
      }
    });

    function updateSyncStatus(status) {
      const dot = document.getElementById('sync-status-dot');
      const text = document.getElementById('sync-status-text');
      if (status === 'synced') {
        dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block shadow-sm shadow-emerald-400";
        text.innerText = "Synced Live across Phone & PC";
      } else if (status === 'saving') {
        dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse inline-block";
        text.innerText = "Saving changes...";
      } else {
        dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 inline-block";
        text.innerText = "Sync error (offline)";
      }
    }

    window.renderUI = function() {
      const container = document.getElementById('sections-container');
      const scheduleBar = document.getElementById('schedule-bar');
      container.innerHTML = '';
      scheduleBar.innerHTML = '';

      let totalCheckedOverall = 0;
      let totalStudentsOverall = 0;

      if (!appData.sections) appData.sections = [];

      appData.sections.forEach((sec, sIdx) => {
        // Schedule Top Bar Card
        const schedCard = document.createElement('div');
        schedCard.className = "bg-slate-950/60 border border-pink-500/20 p-3.5 rounded-xl flex flex-col justify-between";
        schedCard.innerHTML = `
          <div class="flex justify-between items-start">
            <span class="text-xs font-bold text-pink-400 uppercase tracking-wider">${sec.subject || 'General'}</span>
            <span class="text-[11px] font-mono text-slate-300 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">${sec.room || 'TBA'}</span>
          </div>
          <div class="font-bold text-sm text-slate-100 my-1">${sec.sectionName}</div>
          <div class="text-xs text-slate-400"><i class="fa-regular fa-clock me-1 text-slate-500"></i>${sec.schedule || 'TBA'}</div>
        `;
        scheduleBar.appendChild(schedCard);

        // Main Section Card
        const card = document.createElement('div');
        card.className = "bg-slate-900/90 backdrop-blur-sm border border-pink-500/20 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4";

        // Grading Activities HTML
        let activitiesHTML = '';
        if (!sec.activities) sec.activities = [];
        sec.activities.forEach((act, aIdx) => {
          totalCheckedOverall += Number(act.checkedCount || 0);
          totalStudentsOverall += Number(act.totalStudents || 0);
          const percent = act.totalStudents > 0 ? Math.round((act.checkedCount / act.totalStudents) * 100) : 0;
          const isDone = act.checkedCount >= act.totalStudents && act.totalStudents > 0;

          activitiesHTML += `
            <div class="bg-slate-950/80 border border-slate-800/80 p-3 rounded-xl space-y-2">
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <span class="font-medium text-sm ${isDone ? 'line-through text-slate-500' : 'text-slate-100'}">${act.title}</span>
                  ${isDone ? '<span class="text-[10px] bg-pink-950/80 text-pink-300 border border-pink-800/80 px-1.5 py-0.5 rounded">Finished</span>' : ''}
                </div>
                <button onclick="deleteActivity(${sIdx}, ${aIdx})" class="text-slate-600 hover:text-rose-400 text-xs px-1 transition">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>

              <!-- Counter Adjuster Controls -->
              <div class="flex items-center justify-between text-xs pt-1">
                <div class="flex items-center gap-1">
                  <button onclick="adjustCounter(${sIdx}, ${aIdx}, -5)" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 px-2 py-0.5 rounded font-mono text-[11px]">-5</button>
                  <button onclick="adjustCounter(${sIdx}, ${aIdx}, -1)" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 px-2.5 py-0.5 rounded font-mono text-xs">-1</button>
                  <span class="font-mono text-pink-300 px-2 font-bold">${act.checkedCount} / ${act.totalStudents}</span>
                  <button onclick="adjustCounter(${sIdx}, ${aIdx}, 1)" class="bg-pink-600 hover:bg-pink-500 text-white px-2.5 py-0.5 rounded font-mono text-xs shadow-sm">+1</button>
                  <button onclick="adjustCounter(${sIdx}, ${aIdx}, 5)" class="bg-pink-600 hover:bg-pink-500 text-white px-2 py-0.5 rounded font-mono text-[11px] shadow-sm">+5</button>
                </div>
                <span class="font-mono text-slate-400">${percent}%</span>
              </div>

              <!-- Progress Bar -->
              <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-800">
                <div class="bg-gradient-to-r from-pink-500 to-rose-500 h-full transition-all duration-300" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        });

        // Checkbox Tasks HTML
        let generalTasksHTML = '';
        if (!sec.generalTasks) sec.generalTasks = [];
        sec.generalTasks.forEach((t, tIdx) => {
          generalTasksHTML += `
            <li class="flex items-center justify-between group bg-slate-950/40 border border-slate-800/60 px-3 py-2 rounded-xl">
              <label class="flex items-center gap-2.5 text-xs flex-1 cursor-pointer select-none">
                <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleGeneralTask(${sIdx}, ${tIdx})" class="w-3.5 h-3.5 accent-pink-500 rounded cursor-pointer">
                <span class="${t.done ? 'line-through text-slate-600' : 'text-slate-300'}">${t.text}</span>
              </label>
              <button onclick="deleteGeneralTask(${sIdx}, ${tIdx})" class="text-slate-600 hover:text-rose-400 text-xs opacity-0 group-hover:opacity-100 transition">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </li>
          `;
        });

        // Resource Links HTML
        let linksHTML = '';
        if (!sec.links) sec.links = [];
        sec.links.forEach((l, lIdx) => {
          linksHTML += `
            <a href="${l.url}" target="_blank" class="inline-flex items-center gap-1.5 text-xs bg-pink-950/40 text-pink-300 border border-pink-900/50 px-2.5 py-1 rounded-lg hover:bg-pink-900/40 transition">
              <i class="fa-solid fa-link text-[10px]"></i> ${l.title}
              <button onclick="event.preventDefault(); deleteLink(${sIdx}, ${lIdx})" class="ms-1 text-pink-400/70 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
            </a>
          `;
        });

        card.innerHTML = `
          <div>
            <!-- Section Header -->
            <div class="flex justify-between items-start border-b border-slate-800 pb-3 mb-4">
              <div>
                <h3 class="font-bold text-lg text-white">${sec.sectionName}</h3>
                <p class="text-xs text-pink-400 font-medium">${sec.subject || 'General'} • ${sec.room || 'Room TBA'}</p>
                <p class="text-xs text-slate-400 mt-0.5"><i class="fa-regular fa-clock me-1"></i>${sec.schedule || 'Schedule TBA'}</p>
              </div>
              <button onclick="deleteSection(${sIdx})" class="text-slate-600 hover:text-rose-400 text-sm transition">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>

            <!-- Links Repository -->
            <div class="mb-4">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Links & Drive Folders</span>
                <button onclick="addLink(${sIdx})" class="text-xs text-pink-400 hover:underline">+ Add Link</button>
              </div>
              <div class="flex flex-wrap gap-2">${linksHTML || '<span class="text-xs text-slate-600 italic">No links added yet</span>'}</div>
            </div>

            <!-- Dedicated Activity Checking Tracker -->
            <div class="mb-4">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Papers / Activities Checking</span>
                <button onclick="addActivity(${sIdx})" class="text-xs text-pink-400 hover:underline">+ Add Activity</button>
              </div>
              <div class="space-y-2">${activitiesHTML || '<p class="text-xs text-slate-600 italic">No activity trackers created yet.</p>'}</div>
            </div>

            <!-- General Checklist -->
            <div>
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">General Tasks Checklist</span>
                <button onclick="addGeneralTask(${sIdx})" class="text-xs text-pink-400 hover:underline">+ Add Task</button>
              </div>
              <ul class="space-y-1.5">${generalTasksHTML || '<li class="text-xs text-slate-600 italic">No checklist items.</li>'}</ul>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('global-counter').innerText = `${totalCheckedOverall} / ${totalStudentsOverall} Total Papers Checked`;
    };

    // --- Action Handlers ---
    window.adjustCounter = function(sIdx, aIdx, delta) {
      const act = appData.sections[sIdx].activities[aIdx];
      let newCount = (act.checkedCount || 0) + delta;
      if (newCount < 0) newCount = 0;
      if (newCount > act.totalStudents) newCount = act.totalStudents;
      act.checkedCount = newCount;
      renderUI();
      window.saveState();
    };

    window.addActivity = function(sIdx) {
      const title = prompt("Enter Activity/Paper Name (e.g., Quiz 1, Long Test):");
      if (!title) return;
      const total = prompt("Enter total number of students/papers:", "30");
      if (!total || isNaN(total)) return;

      if (!appData.sections[sIdx].activities) appData.sections[sIdx].activities = [];
      appData.sections[sIdx].activities.push({
        id: Date.now().toString(),
        title: title,
        checkedCount: 0,
        totalStudents: parseInt(total)
      });
      renderUI();
      window.saveState();
    };

    window.deleteActivity = function(sIdx, aIdx) {
      appData.sections[sIdx].activities.splice(aIdx, 1);
      renderUI();
      window.saveState();
    };

    window.addGeneralTask = function(sIdx) {
      const text = prompt("Enter general task / deliverable:");
      if (!text) return;
      if (!appData.sections[sIdx].generalTasks) appData.sections[sIdx].generalTasks = [];
      appData.sections[sIdx].generalTasks.push({ id: Date.now().toString(), text, done: false });
      renderUI();
      window.saveState();
    };

    window.toggleGeneralTask = function(sIdx, tIdx) {
      appData.sections[sIdx].generalTasks[tIdx].done = !appData.sections[sIdx].generalTasks[tIdx].done;
      renderUI();
      window.saveState();
    };

    window.deleteGeneralTask = function(sIdx, tIdx) {
      appData.sections[sIdx].generalTasks.splice(tIdx, 1);
      renderUI();
      window.saveState();
    };

    window.addLink = function(sIdx) {
      const title = prompt("Enter Link Name (e.g. Class Drive, Canvas LMS):");
      if (!title) return;
      const url = prompt("Paste Link URL:");
      if (!url) return;
      if (!appData.sections[sIdx].links) appData.sections[sIdx].links = [];
      appData.sections[sIdx].links.push({ title, url });
      renderUI();
      window.saveState();
    };

    window.deleteLink = function(sIdx, lIdx) {
      appData.sections[sIdx].links.splice(lIdx, 1);
      renderUI();
      window.saveState();
    };

    window.addNewSection = function() {
      const sectionName = prompt("Enter Section Name (e.g. Grade 10 - St. Jude):");
      if (!sectionName) return;
      const subject = prompt("Enter Subject Handled:") || "General";
      const room = prompt("Enter Room Number:") || "Room TBA";
      const schedule = prompt("Enter Schedule Time (e.g., 08:00 AM - 09:30 AM):") || "TBA";

      appData.sections.push({
        id: Date.now().toString(),
        sectionName,
        subject,
        room,
        schedule,
        links: [],
        activities: [],
        generalTasks: []
      });
      renderUI();
      window.saveState();
    };

    window.deleteSection = function(sIdx) {
      if (confirm(`Delete section "${appData.sections[sIdx].sectionName}"?`)) {
        appData.sections.splice(sIdx, 1);
        renderUI();
        window.saveState();
      }
    };
  </script>
</body>
</html>
